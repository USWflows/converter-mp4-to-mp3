name: Validate Pulse Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out files
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check app.js
          node --check sw.js
      - name: Verify manifest and local references
        shell: bash
        run: |
          node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('manifest.json')); const files=['index.html','app.js','styles.css','sw.js','manifest.json','icon-192.png','icon-512.png']; for(const f of files){ if(!fs.existsSync(f)) throw new Error('Missing '+f); }"
