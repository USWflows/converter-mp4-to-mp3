<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse Audio — MP4 to MP3 Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #090a0f;
      --card-bg: rgba(18, 20, 29, 0.65);
      --border-glow: rgba(99, 102, 241, 0.2);
      --accent-cyan: #06b6d4;
      --accent-indigo: #6366f1;
      --accent-violet: #8b5cf6;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .nav-bar {
      display: flex;
      gap: 8px;
      background: rgba(18, 20, 29, 0.8);
      padding: 6px;
      border-radius: 100px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
    }

    .nav-link {
      padding: 8px 18px;
      border-radius: 100px;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .nav-link.active {
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-violet));
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .app-card {
      width: 100%;
      max-width: 540px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 40px;
      box-shadow: 
        0 30px 60px -12px rgba(0, 0, 0, 0.5),
        0 0 40px -10px var(--border-glow);
      position: relative;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 100px;
      color: var(--accent-cyan);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .brand-pill-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 8px var(--accent-cyan);
    }

    .title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    .visualizer-container {
      height: 48px;
      width: 100%;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    canvas {
      width: 100%;
      height: 100%;
    }

    .drop-area {
      border: 1.5px dashed rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.02);
      border-radius: 20px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      margin-bottom: 24px;
    }

    .drop-area:hover, .drop-area.dragover {
      border-color: var(--accent-indigo);
      background: rgba(99, 102, 241, 0.04);
      transform: translateY(-2px);
    }

    .drop-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .upload-icon {
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px auto;
      color: var(--accent-cyan);
    }

    .drop-text-primary {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .drop-text-secondary {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .file-pill {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 14px;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.2);
      border-radius: 8px;
      font-size: 0.82rem;
      color: var(--accent-cyan);
      font-weight: 500;
      word-break: break-all;
    }

    .control-wrapper {
      margin-bottom: 28px;
    }

    .control-label {
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-sub);
      margin-bottom: 10px;
      display: block;
    }

    .bitrate-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .bitrate-option {
      position: relative;
    }

    .bitrate-option input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .bitrate-label {
      display: block;
      padding: 10px 0;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-sub);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .bitrate-option input:checked + .bitrate-label {
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-violet));
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-convert {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-indigo));
      color: #ffffff;
      box-shadow: 0 8px 24px -4px rgba(99, 102, 241, 0.4);
    }

    .btn-convert:hover:not(:disabled) {
      transform: translateY(-2px);
    }

    .btn-convert:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-download {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      margin-top: 14px;
      box-shadow: 0 8px 24px -4px rgba(16, 185, 129, 0.4);
    }

    .status-bar {
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-sub);
      min-height: 20px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</head>
<body>

  <nav class="nav-bar">
    <a href="index.html" class="nav-link active">MP4 to MP3</a>
    <a href="mp3-to-mp4.html" class="nav-link">MP3 to MP4</a>
  </nav>

  <div class="app-card">
    <div class="header">
      <div class="brand-pill">
        <span class="brand-pill-dot"></span> WebAssembly Engine
      </div>
      <h1 class="title">Pulse Audio</h1>
      <p class="subtitle">Extract pristine MP3 tracks directly in your browser</p>
    </div>

    <div class="visualizer-container">
      <canvas id="canvas"></canvas>
    </div>

    <div class="drop-area" id="dropZone">
      <input type="file" id="uploader" accept="video/*,.mp4,.mov,.m4v" />
      <div class="upload-icon">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="drop-text-primary" id="dropTitle">Drop your MP4 file here</p>
      <p class="drop-text-secondary">or click to browse from device</p>
      <div id="filePill" style="display: none;"></div>
    </div>

    <div class="control-wrapper">
      <label class="control-label">Audio Quality</label>
      <div class="bitrate-grid">
        <div class="bitrate-option">
          <input type="radio" name="bitrate" id="b128" value="128k">
          <label for="b128" class="bitrate-label">128k</label>
        </div>
        <div class="bitrate-option">
          <input type="radio" name="bitrate" id="b192" value="192k" checked>
          <label for="b192" class="bitrate-label">192k</label>
        </div>
        <div class="bitrate-option">
          <input type="radio" name="bitrate" id="b256" value="256k">
          <label for="b256" class="bitrate-label">256k</label>
        </div>
        <div class="bitrate-option">
          <input type="radio" name="bitrate" id="b320" value="320k">
          <label for="b320" class="bitrate-label">320k</label>
        </div>
      </div>
    </div>

    <button id="convertBtn" class="btn btn-convert" disabled>
      <span>Convert to MP3</span>
    </button>

    <a id="downloadLink" class="btn btn-download" style="display: none;">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Save MP3 File
    </a>

    <div class="status-bar" id="status">
      Initializing audio engine...
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let isProcessing = false;

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function drawWave(time) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const bars = 32;
      const barWidth = 3;
      const gap = (canvas.width - (bars * barWidth)) / (bars + 1);

      for (let i = 0; i < bars; i++) {
        const x = gap + i * (barWidth + gap);
        let height = isProcessing ? Math.sin(time * 0.005 + i * 0.3) * 16 + 20 : Math.sin(i * 0.4) * 4 + 8;
        const y = (canvas.height - height) / 2;
        ctx.fillStyle = isProcessing ? '#06b6d4' : '#334155';
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, height, 2);
        ctx.fill();
      }
      requestAnimationFrame(drawWave);
    }
    requestAnimationFrame(drawWave);

    const { createFFmpeg } = FFmpeg;
    const ffmpeg = createFFmpeg({
      log: true,
      mainName: 'main',
      corePath: 'https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js'
    });

    const uploader = document.getElementById('uploader');
    const dropZone = document.getElementById('dropZone');
    const dropTitle = document.getElementById('dropTitle');
    const filePill = document.getElementById('filePill');
    const convertBtn = document.getElementById('convertBtn');
    const status = document.getElementById('status');
    const downloadLink = document.getElementById('downloadLink');

    let selectedFile = null;
    let outputBlob = null;
    let outputFileName = "";

    ffmpeg.setProgress(({ ratio }) => {
      if (isProcessing && ratio > 0) {
        const percent = Math.min(Math.round(ratio * 100), 100);
        status.innerHTML = `<span class="spinner"></span> Converting... ${percent}%`;
      }
    });

    async function initFFmpeg() {
      try {
        status.innerText = 'Downloading audio engine...';
        await ffmpeg.load();
        status.innerText = 'Engine ready. Drop a file to start.';
        if (selectedFile) convertBtn.disabled = false;
      } catch (error) {
        status.innerText = 'Failed to load engine. Please refresh page.';
        console.error(error);
      }
    }

    initFFmpeg();

    uploader.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFileSelect(e.target.files[0]);
    });

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
      dropZone.addEventListener(evt, (e) => e.preventDefault(), false);
    });

    dropZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length > 0) handleFileSelect(files[0]);
    });

    function handleFileSelect(file) {
      selectedFile = file;
      dropTitle.innerText = 'File loaded';
      filePill.innerText = `${file.name} (${(file.size / (1024*1024)).toFixed(1)} MB)`;
      filePill.style.display = 'inline-block';
      
      convertBtn.disabled = !ffmpeg.isLoaded();
      downloadLink.style.display = 'none';
      
      if (ffmpeg.isLoaded()) {
        status.innerText = 'File ready. Click Convert to start.';
      } else {
        status.innerText = 'File selected. Waiting for engine to finish loading...';
      }
    }

    convertBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      const bitrate = document.querySelector('input[name="bitrate"]:checked')?.value || '192k';
      const ext = selectedFile.name.split('.').pop() || 'mp4';
      const inFileName = `input.${ext}`;

      convertBtn.disabled = true;
      downloadLink.style.display = 'none';
      isProcessing = true;

      try {
        status.innerHTML = `<span class="spinner"></span> Reading file into memory...`;
        const fileData = await selectedFile.arrayBuffer();
        
        status.innerHTML = `<span class="spinner"></span> Preparing encoder...`;
        ffmpeg.FS('writeFile', inFileName, new Uint8Array(fileData));

        status.innerHTML = `<span class="spinner"></span> Starting conversion...`;
        await ffmpeg.run(
          '-i', inFileName,
          '-vn',
          '-acodec', 'libmp3lame',
          '-b:a', bitrate,
          'output.mp3'
        );

        status.innerHTML = `<span class="spinner"></span> Finishing up...`;
        const data = ffmpeg.FS('readFile', 'output.mp3');
        outputBlob = new Blob([data.buffer], { type: 'audio/mpeg' });
        outputFileName = selectedFile.name.replace(/\.[^/.]+$/, "") + `_${bitrate}.mp3`;
        const url = URL.createObjectURL(outputBlob);

        downloadLink.href = url;
        downloadLink.download = outputFileName;
        downloadLink.style.display = 'flex';

        status.innerText = 'Conversion finished!';
      } catch (error) {
        status.innerText = 'Error converting file. Please try again.';
        console.error(error);
      } finally {
        isProcessing = false;
        convertBtn.disabled = false;
      }
    });

    downloadLink.addEventListener('click', async (e) => {
      if (!outputBlob) return;

      const file = new File([outputBlob], outputFileName, { type: 'audio/mpeg' });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        e.preventDefault();
        try {
          await navigator.share({
            files: [file],
            title: 'Save Audio',
            text: 'Save MP3 File'
          });
        } catch (err) {
          if (err.name !== 'AbortError') console.error('Share failed:', err);
        }
      }
    });
  </script>
</body>
</html>
